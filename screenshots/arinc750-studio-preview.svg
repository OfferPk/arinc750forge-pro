<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#07090e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Top Navigation Bar -->
  <rect x="20" y="15" width="960" height="50" rx="6" fill="#0f141e" stroke="#1e293b"/>
  <text x="40" y="46" fill="#06b6d4" font-size="18" font-weight="700">ARINC750Forge Pro (v1.0.0) — VHF Comm &amp; VDL Mode 2 Station</text>
  <rect x="760" y="26" width="200" height="28" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
  <text x="775" y="45" fill="#10b981" font-size="11" font-weight="700">TSO-C169a / ED-23C PASS</text>

  <!-- Cockpit RMP Bezel Left Panel -->
  <rect x="20" y="80" width="350" height="500" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  
  <rect x="40" y="105" width="310" height="150" rx="6" fill="#18202c" stroke="#334155"/>
  
  <!-- Active Freq Display -->
  <rect x="55" y="125" width="135" height="65" rx="4" fill="#020617" stroke="#0f172a"/>
  <text x="70" y="165" fill="#22d3ee" font-family="'SF Mono', monospace" font-size="24" font-weight="900" letter-spacing="1">118.005</text>
  <text x="70" y="180" fill="#94a3b8" font-size="9">RF: 118.0000 MHz (8.33k)</text>

  <!-- Stby Freq Display -->
  <rect x="200" y="125" width="135" height="65" rx="4" fill="#020617" stroke="#0f172a"/>
  <text x="215" y="165" fill="#fbbf24" font-family="'SF Mono', monospace" font-size="24" font-weight="900" letter-spacing="1">118.750</text>
  <text x="215" y="180" fill="#94a3b8" font-size="9">DXB Tower (25k)</text>

  <!-- Transfer button -->
  <rect x="55" y="200" width="280" height="35" rx="4" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4"/>
  <text x="95" y="222" fill="#06b6d4" font-size="12" font-weight="700">⮂ TRANSFER (ACTIVE ⮂ STBY)</text>

  <!-- Transceiver Unit Buttons -->
  <rect x="40" y="270" width="95" height="38" rx="4" fill="#1e293b" stroke="#06b6d4"/>
  <text x="55" y="294" fill="#f8fafc" font-size="11" font-weight="700">VHF 1 (CAPT)</text>

  <rect x="145" y="270" width="95" height="38" rx="4" fill="#18202c" stroke="#334155"/>
  <text x="160" y="294" fill="#94a3b8" font-size="11" font-weight="700">VHF 2 (F/O)</text>

  <rect x="250" y="270" width="100" height="38" rx="4" fill="#18202c" stroke="#334155"/>
  <text x="265" y="294" fill="#94a3b8" font-size="11" font-weight="700">VHF 3 (VDL2)</text>

  <!-- PTT Button -->
  <rect x="40" y="320" width="310" height="40" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444"/>
  <text x="90" y="345" fill="#fca5a5" font-size="13" font-weight="800">HOLD TO TRANSMIT (PTT - 25W)</text>

  <!-- Quick Presets -->
  <rect x="40" y="375" width="70" height="30" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="394" fill="#f8fafc" font-size="10" font-weight="600">118.750</text>

  <rect x="120" y="375" width="70" height="30" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="130" y="394" fill="#f8fafc" font-size="10" font-weight="600">132.005</text>

  <rect x="200" y="375" width="70" height="30" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="210" y="394" fill="#f8fafc" font-size="10" font-weight="600">136.975</text>

  <rect x="280" y="375" width="70" height="30" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="290" y="394" fill="#ef4444" font-size="10" font-weight="700">121.500</text>

  <!-- Status Readout Card -->
  <rect x="40" y="420" width="310" height="145" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="55" y="445" fill="#38bdf8" font-size="11" font-weight="700">TRANSMITTER &amp; RECEIVER STATUS</text>
  <text x="55" y="470" fill="#cbd5e1" font-size="11">RF Power: 25.0 Watts (+44 dBm DSB-AM)</text>
  <text x="55" y="490" fill="#cbd5e1" font-size="11">Sidetone Feedback: Audio Loopback Active</text>
  <text x="55" y="510" fill="#cbd5e1" font-size="11">Anti-Stuck Mic Protection: 35s Timeout Armed</text>
  <text x="55" y="530" fill="#34d399" font-size="11">Carrier Squelch: -100.0 dBm Threshold (Open)</text>
  <text x="55" y="550" fill="#06b6d4" font-size="11">VDL Mode 2 D8PSK Engine: 31,500 bps Standby</text>

  <!-- Right: VDL Mode 2 D8PSK & 10-Point Auditor -->
  <rect x="390" y="80" width="590" height="235" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  <text x="410" y="110" fill="#06b6d4" font-size="13" font-weight="700">VDL MODE 2 D8PSK DATALINK ENGINE &amp; ARINC 429 WORDS</text>
  
  <rect x="410" y="125" width="550" height="28" fill="rgba(255,255,255,0.03)"/>
  <text x="420" y="144" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">Label 030  0xE0187518  Tuning: 118.750 MHz  Parity: ODD (PASS)</text>

  <rect x="410" y="155" width="550" height="28" fill="transparent"/>
  <text x="420" y="174" fill="#34d399" font-size="11" font-family="'SF Mono', monospace">Label 270  0x6000351D  Status: PTT Keyed, 8.33k  Parity: ODD (PASS)</text>

  <rect x="410" y="185" width="550" height="28" fill="rgba(255,255,255,0.03)"/>
  <text x="420" y="204" fill="#fbbf24" font-size="11" font-family="'SF Mono', monospace">Label 350  0x60000117  Maintenance BITE Normal   Parity: ODD (PASS)</text>

  <rect x="410" y="215" width="550" height="28" fill="transparent"/>
  <text x="420" y="234" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">VDL2 D8PSK  10,500 Baud  31,500 bps (3 bits/symbol Gray Coded)</text>

  <rect x="410" y="245" width="550" height="28" fill="rgba(255,255,255,0.03)"/>
  <text x="420" y="264" fill="#c084fc" font-size="11" font-family="'SF Mono', monospace">AVLC Packet: "CPDLC CONNECT REQ / ATC LOGON"  CRC-16: 0x4B21</text>

  <!-- Right Bottom: 10-Point Normative Auditor -->
  <rect x="390" y="335" width="590" height="245" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  <text x="410" y="365" fill="#10b981" font-size="13" font-weight="700">10-POINT NORMATIVE AUDITOR (10/10 PASSED - 100%)</text>

  <text x="410" y="395" fill="#cbd5e1" font-size="11">[PASSED] A750_01: Triple VHF Transceiver Architecture (VHF 1, 2 &amp; Dedicated Data)</text>
  <text x="410" y="420" fill="#cbd5e1" font-size="11">[PASSED] A750_02: ARINC 429 Bit 32 Odd Parity Rule on Tuning &amp; Status Words</text>
  <text x="410" y="445" fill="#cbd5e1" font-size="11">[PASSED] A750_03: ICAO Annex 10 &amp; EU 1079/2012 8.33 kHz Channel Mapping</text>
  <text x="410" y="470" fill="#cbd5e1" font-size="11">[PASSED] A750_04: Dual-Bandwidth Selectivity (25 kHz wide vs 8.33 kHz narrow)</text>
  <text x="410" y="495" fill="#cbd5e1" font-size="11">[PASSED] A750_05: VDL Mode 2 D8PSK Modulation Symbol &amp; Bit Rate (31.5 kbps)</text>
  <text x="410" y="520" fill="#cbd5e1" font-size="11">[PASSED] A750_06: VDL Mode 2 AVLC Frame Check Sequence (CRC-16) Integrity</text>
  <text x="410" y="545" fill="#cbd5e1" font-size="11">[PASSED] A750_07: Push-To-Talk (PTT) Keying &amp; Anti-Stuck-Mic 35s Timeout</text>
</svg>